name: Deploy Backend Only

on:
  push:
    branches:
      - 'backend/**'  # backend/로 시작하는 모든 브랜치
    paths:
      - 'backend/**'
  workflow_dispatch:

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ secrets.AWS_REGION }}
    
    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2
      with:
        mask-password: 'true'
    
    - name: Build and push backend image
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY_BACKEND }}
        IMAGE_TAG: ${{ github.sha }}
      run: |
        echo "🔨 Backend 이미지 빌드 중..."
        cd backend
        
        docker buildx build \
          --platform linux/amd64 \
          --tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
          --tag $ECR_REGISTRY/$ECR_REPOSITORY:latest \
          --push \
          --progress=plain \
          -f Dockerfile \
          .
        
        echo "✅ Backend 이미지 빌드 및 푸시 완료"
    
    - name: Deploy backend to EC2
      env:
        EC2_HOST: ${{ secrets.EC2_HOST }}
        EC2_USER: ${{ secrets.EC2_USER }}
        EC2_KEY: ${{ secrets.EC2_PRIVATE_KEY }}
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG: ${{ github.sha }}
      run: |
        echo "$EC2_KEY" > ec2_key.pem
        chmod 600 ec2_key.pem
        
        ssh -i ec2_key.pem -o StrictHostKeyChecking=no $EC2_USER@$EC2_HOST << EOF
          # AWS 자격증명 설정
          export AWS_ACCESS_KEY_ID="${{ secrets.AWS_ACCESS_KEY_ID }}"
          export AWS_SECRET_ACCESS_KEY="${{ secrets.AWS_SECRET_ACCESS_KEY }}"
          export AWS_DEFAULT_REGION="${{ secrets.AWS_REGION }}"
          
          # ECR 로그인
          aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | docker login --username AWS --password-stdin $ECR_REGISTRY
          
          # 새 백엔드 이미지 pull
          docker pull $ECR_REGISTRY/${{ secrets.ECR_REPOSITORY_BACKEND }}:$IMAGE_TAG
          
          # 백엔드 컨테이너만 재시작
          docker stop teamPicko-backend || true
          docker rm teamPicko-backend || true
          
          # 새 이미지로 백엔드 컨테이너 시작
          docker run -d \
            --name teamPicko-backend \
            --network teamPicko_default \
            -p 8000:8000 \
            --env-file ~/.env \
            --restart unless-stopped \
            $ECR_REGISTRY/${{ secrets.ECR_REPOSITORY_BACKEND }}:$IMAGE_TAG
          
          # 헬스체크
          sleep 30
          curl -f http://localhost:8000/health/ || echo "⚠️ Backend health check failed"
          
          echo "✅ Backend 개별 배포 완료"
        EOF
        
        rm ec2_key.pem
    
    # 배포 성공 시 자동으로 dev에 직접 머지
    - name: Merge to dev branch
      if: success()
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        
        # dev 브랜치 체크아웃
        git fetch origin dev
        git checkout dev
        git pull origin dev
        
        # feature 브랜치 머지
        git merge origin/${{ github.ref_name }} --no-ff -m "feat(backend): ${{ github.ref_name }} 배포 완료
        
        - Backend 코드 업데이트
        - EC2 배포 및 테스트 완료
        
        🤖 Generated with [Claude Code](https://claude.ai/code)"
        
        # dev에 푸시
        git push origin dev
        
        echo "✅ dev 브랜치 머지 완료"
    
    # dev PR 생성 후 main PR도 생성
    - name: Create Pull Request to main
      if: success()
      uses: peter-evans/create-pull-request@v6
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        branch: ${{ github.ref_name }}
        base: main
        title: "feat(backend): ${{ github.ref_name }} 운영 배포 준비"
        body: |
          ## Backend 운영 배포 준비
          
          🚀 **브랜치**: `${{ github.ref_name }}`
          📦 **개발 테스트**: 완료
          🔗 **배포 로그**: [Actions Run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
          
          ### 변경사항
          - Backend 기능 구현 완료
          - 개발 환경 배포 및 테스트 완료
          
          ### 체크리스트
          - [x] 개발 환경 배포 성공
          - [x] Health check 통과
          - [ ] 코드 리뷰 완료
          - [ ] QA 테스트 완료
          
          🤖 Generated with [Claude Code](https://claude.ai/code)
        assignees: ${{ github.actor }}
        draft: true  # main PR은 draft로 생성