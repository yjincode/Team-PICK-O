name: Deploy AI Server Only

on:
  push:
    branches:
      - main
    paths:
      - 'aiserver/**'
  workflow_dispatch:

jobs:
  deploy-aiserver:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ secrets.AWS_REGION }}
    
    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2
      with:
        mask-password: 'true'
    
    - name: Build and push AI server image
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY_AISERVER }}
        IMAGE_TAG: ${{ github.sha }}
      run: |
        echo "🔨 AI Server 이미지 빌드 중..."
        cd aiserver
        
        docker buildx build \
          --platform linux/amd64 \
          --tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
          --tag $ECR_REGISTRY/$ECR_REPOSITORY:latest \
          --push \
          --progress=plain \
          -f Dockerfile \
          .
        
        echo "✅ AI Server 이미지 빌드 및 푸시 완료"
    
    - name: Deploy AI server to EC2
      env:
        EC2_HOST: ${{ secrets.EC2_HOST }}
        EC2_USER: ${{ secrets.EC2_USER }}
        EC2_KEY: ${{ secrets.EC2_PRIVATE_KEY }}
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG: ${{ github.sha }}
      run: |
        echo "$EC2_KEY" > ec2_key.pem
        chmod 600 ec2_key.pem
        
        ssh -i ec2_key.pem -o StrictHostKeyChecking=no $EC2_USER@$EC2_HOST << EOF
          # AWS 자격증명 설정
          export AWS_ACCESS_KEY_ID="${{ secrets.AWS_ACCESS_KEY_ID }}"
          export AWS_SECRET_ACCESS_KEY="${{ secrets.AWS_SECRET_ACCESS_KEY }}"
          export AWS_DEFAULT_REGION="${{ secrets.AWS_REGION }}"
          
          # ECR 로그인
          aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | docker login --username AWS --password-stdin $ECR_REGISTRY
          
          # 새 AI 서버 이미지 pull
          docker pull $ECR_REGISTRY/${{ secrets.ECR_REPOSITORY_AISERVER }}:$IMAGE_TAG
          
          # AI 서버 컨테이너만 재시작
          docker stop teamPicko-aiserver || true
          docker rm teamPicko-aiserver || true
          
          # 새 이미지로 AI 서버 컨테이너 시작
          docker run -d \
            --name teamPicko-aiserver \
            --network teamPicko_default \
            -e PYTHONPATH=/app \
            -e PYTHONUNBUFFERED=1 \
            -e TF_CPP_MIN_LOG_LEVEL=2 \
            -e CUDA_VISIBLE_DEVICES="" \
            -e AI_SERVER_PORT=8001 \
            -e AI_SERVER_HOST=0.0.0.0 \
            -e AWS_ACCESS_KEY_ID="${{ secrets.AWS_ACCESS_KEY_ID }}" \
            -e AWS_SECRET_ACCESS_KEY="${{ secrets.AWS_SECRET_ACCESS_KEY }}" \
            -e AWS_S3_BUCKET_NAME="${{ secrets.AWS_S3_BUCKET_NAME }}" \
            -e AWS_REGION="${{ secrets.AWS_REGION }}" \
            -v teamPicko_aiserver-models:/app/models \
            -v teamPicko_aiserver-logs:/app/logs \
            --restart unless-stopped \
            $ECR_REGISTRY/${{ secrets.ECR_REPOSITORY_AISERVER }}:$IMAGE_TAG
          
          # 헬스체크 (AI 서버는 시작 시간이 오래 걸림)
          sleep 60
          curl -f http://localhost:8001/health || echo "⚠️ AI Server health check failed"
          
          echo "✅ AI Server 개별 배포 완료"
        EOF
        
        rm ec2_key.pem