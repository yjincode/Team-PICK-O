name: Deploy Frontend Only

on:
  push:
    branches:
      - 'frontend/**'  # frontend/로 시작하는 모든 브랜치
    paths:
      - 'frontend/**'
  workflow_dispatch:

jobs:
  deploy-frontend:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ secrets.AWS_REGION }}
    
    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2
      with:
        mask-password: 'true'
    
    - name: Build and push frontend image
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY_FRONTEND }}
        IMAGE_TAG: ${{ github.sha }}
      run: |
        echo "🔨 Frontend 이미지 빌드 중..."
        cd frontend
        
        docker buildx build \
          --platform linux/amd64 \
          --build-arg VITE_API_BASE_URL="/api/v1" \
          --build-arg NODE_ENV="production" \
          --tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
          --tag $ECR_REGISTRY/$ECR_REPOSITORY:latest \
          --push \
          --progress=plain \
          -f Dockerfile \
          .
        
        echo "✅ Frontend 이미지 빌드 및 푸시 완료"
    
    - name: Deploy frontend to EC2
      env:
        EC2_HOST: ${{ secrets.EC2_HOST }}
        EC2_USER: ${{ secrets.EC2_USER }}
        EC2_KEY: ${{ secrets.EC2_PRIVATE_KEY }}
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG: ${{ github.sha }}
      run: |
        echo "$EC2_KEY" > ec2_key.pem
        chmod 600 ec2_key.pem
        
        ssh -i ec2_key.pem -o StrictHostKeyChecking=no $EC2_USER@$EC2_HOST << EOF
          # AWS 자격증명 설정
          export AWS_ACCESS_KEY_ID="${{ secrets.AWS_ACCESS_KEY_ID }}"
          export AWS_SECRET_ACCESS_KEY="${{ secrets.AWS_SECRET_ACCESS_KEY }}"
          export AWS_DEFAULT_REGION="${{ secrets.AWS_REGION }}"
          
          # 디스크 공간 확보를 위한 Docker 정리
          echo "🧹 Docker 리소스 정리 중..."
          
          # Frontend 컨테이너 중지 및 제거
          docker stop teamPicko-frontend || true
          docker rm teamPicko-frontend || true
          
          # Frontend 관련 이미지만 선택적 삭제
          docker images --format "table {{.Repository}}:{{.Tag}}\t{{.ID}}" | grep frontend | awk '{print \$2}' | xargs -I {} docker rmi -f {} || true
          
          # 사용하지 않는 리소스 정리
          docker system prune -f
          
          echo "🔍 정리 후 디스크 공간:"
          df -h
          
          # ECR 로그인
          aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | docker login --username AWS --password-stdin $ECR_REGISTRY
          
          # 새 프론트엔드 이미지 pull
          docker pull $ECR_REGISTRY/${{ secrets.ECR_REPOSITORY_FRONTEND }}:$IMAGE_TAG
          
          # 새 이미지로 프론트엔드 컨테이너 시작
          docker run -d \
            --name teamPicko-frontend \
            --network teamPicko_default \
            -p 80:80 -p 443:443 \
            -v /etc/letsencrypt:/etc/letsencrypt:ro \
            --restart unless-stopped \
            $ECR_REGISTRY/${{ secrets.ECR_REPOSITORY_FRONTEND }}:$IMAGE_TAG
          
          # 헬스체크
          sleep 30
          curl -f http://localhost/ || echo "⚠️ Frontend health check failed"
          
          echo "✅ Frontend 개별 배포 완료"
        EOF
        
        rm ec2_key.pem
    
    # 배포 성공 시 자동으로 dev, main PR 생성
    - name: Create Pull Request to dev
      if: success()
      uses: peter-evans/create-pull-request@v6
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        branch: ${{ github.ref_name }}
        base: dev
        title: "feat(frontend): ${{ github.ref_name }} 개발 완료"
        body: |
          ## Frontend 개발 완료
          
          🚀 **브랜치**: `${{ github.ref_name }}`
          📦 **배포 테스트**: 완료
          🔗 **Actions**: [배포 로그](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
          
          ### 변경사항
          - Frontend 기능 구현
          - 배포 테스트 완료
          
          ### 테스트 완료
          - [x] Docker 빌드 성공
          - [x] EC2 배포 성공
          - [x] Health check 통과
          
          🤖 Generated with [Claude Code](https://claude.ai/code)
        assignees: ${{ github.actor }}
        draft: false
    
    - name: Create Pull Request to main
      if: success()
      uses: peter-evans/create-pull-request@v6
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        branch: ${{ github.ref_name }}
        base: main
        title: "feat(frontend): ${{ github.ref_name }} 운영 배포 준비"
        body: |
          ## Frontend 운영 배포 준비
          
          🚀 **브랜치**: `${{ github.ref_name }}`
          📦 **개발 테스트**: 완료
          🔗 **배포 로그**: [Actions Run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
          
          ### 변경사항
          - Frontend 기능 구현 완료
          - 개발 환경 배포 및 테스트 완료
          
          ### 체크리스트
          - [x] 개발 환경 배포 성공
          - [x] Health check 통과
          - [ ] 코드 리뷰 완료
          - [ ] QA 테스트 완료
          
          🤖 Generated with [Claude Code](https://claude.ai/code)
        assignees: ${{ github.actor }}
        draft: true